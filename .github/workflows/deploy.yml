name: Deploy JOHN-MART to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout JOHN-MART
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare JOHN-MART Website
        run: |
          mkdir -p _site
          cp -r ./*.html _site/ 2>/dev/null || true
          cp -r ./*.css _site/ 2>/dev/null || true
          cp -r ./*.js _site/ 2>/dev/null || true
          cp -r images _site/ 2>/dev/null || true

      - name: Upload JOHN-MART Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy JOHN-MART to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
