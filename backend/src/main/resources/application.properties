# ==========================================================
# JOHN MART - Spring Boot Application Configuration
# ==========================================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=johnmart-backend

# ----------------------------------------------------------
# DATABASE CONFIGURATION
# ----------------------------------------------------------
# Default: H2 In-Memory Database with MySQL compatibility mode
# (Zero-config instant startup, pre-seeded with sample catalog, users, cart, orders)
spring.datasource.url=jdbc:h2:mem:johnmart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# # H2 Web Console (Available at http://localhost:8080/h2-console)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.h2.console.settings.web-allow-others=true

# Hibernate & JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------
# OPTIONAL: Switch to Local MySQL
# To use MySQL instead of H2, comment out the H2 lines above and uncomment below:
# ----------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/johnmart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root                               
spring.datasource.password=my-secret-pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false

# SQL script initialization
spring.sql.init.mode=never
