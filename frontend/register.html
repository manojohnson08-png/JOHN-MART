<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — JOHN MART</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header .logo {
      justify-content: center;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></div>
        JOHN <span>MART</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">
        <i class="fa-solid fa-house"></i> Back to Store
      </a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></div>
          JOHN <span>MART</span>
        </a>
        <h2 style="font-size: 1.5rem; color: var(--secondary);">Create Your Account</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.25rem;">Join thousands of happy shoppers at JOHN MART</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Alex Morgan" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-submit-btn" style="margin-top: 1rem;">
          Register Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      const btn = document.getElementById('reg-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Creating Account...`;

      try {
        const res = await API.register({ name, email, phone, password });
        Auth.setUser(res.data);
        showToast("Registration successful! Welcome to JOHN MART.", "success");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 800);
      } catch (error) {
        showToast(error.message || "Registration failed. Email may already be taken.", "error");
        btn.disabled = false;
        btn.innerHTML = `Register Account`;
      }
    });
  </script>
</body>
</html>
