<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — JOHN MART</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header .logo {
      justify-content: center;
      margin-bottom: 1rem;
    }

    .demo-users-box {
      background: var(--bg-muted);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      border: 1px solid var(--border-color);
    }

    .demo-btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></div>
        JOHN <span>MART</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">
        <i class="fa-solid fa-house"></i> Back to Store
      </a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="fa-solid fa-bag-shopping"></i></div>
          JOHN <span>MART</span>
        </a>
        <h2 style="font-size: 1.5rem; color: var(--secondary);">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.25rem;">Enter your credentials to access your account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit-btn" style="margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create Account</a>
      </div>

      <!-- Quick Demo Access Credentials -->
      <div class="demo-users-box">
        <strong style="color: var(--secondary);"><i class="fa-solid fa-key"></i> Quick Demo Access:</strong>
        <div class="demo-btn-group">
          <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.75rem;" onclick="fillDemo('john@example.com', 'password123')">
            User: John Doe
          </button>
          <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.75rem;" onclick="fillDemo('admin@johnmart.com', 'admin123')">
            Admin Portal
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemo(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();

      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Signing In...`;

      try {
        const res = await API.login({ email, password });
        Auth.setUser(res.data);
        showToast(res.message || "Login successful!", "success");

        const redirect = new URLSearchParams(window.location.search).get('redirect');
        setTimeout(() => {
          if (res.data.role === 'ADMIN' && !redirect) {
            window.location.href = "admin.html";
          } else {
            window.location.href = redirect || "index.html";
          }
        }, 600);
      } catch (error) {
        showToast(error.message || "Invalid email or password", "error");
        btn.disabled = false;
        btn.innerHTML = `Sign In`;
      }
    });
  </script>
</body>
</html>
